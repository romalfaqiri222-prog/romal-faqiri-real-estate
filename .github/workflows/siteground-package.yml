name: Build SiteGround Package

on:
  push:
    branches:
      - siteground-package
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create package
        run: |
          zip -j rf-siteground.zip index.html faqiri-logo.svg favicon.svg manifest.webmanifest robots.txt sitemap.xml sw.js
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rf-siteground-package
          path: rf-siteground.zip
          if-no-files-found: error
